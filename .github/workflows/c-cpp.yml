name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: compile teste
      run: gcc test_fatorial.c -o test_fatorial
    - name: execute teste
      run: ./test_fatorial
    - name: compile programa principal
      run: gcc fatorial.c -o fatorial
    - name: execute programa principal
      run: ./fatorial 4
